<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics · VCS3 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- SCR-14 Statistics (US-022; BR-005, BR-028) -->
<main id="main" class="app-main" tabindex="-1">
  <div class="page-banner"><div class="breadcrumb">Reports</div><h1>Notice statistics</h1><div class="actions"><button type="button" class="btn btn-secondary" id="csvBtn">Export CSV</button></div></div>
  <div class="page-content" id="content"></div>
</main>
<script src="data/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/rules.js"></script>
<script src="js/workflow.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var S = VCS.store, R = VCS.rules, A = VCS.app;
  A.init({ page: 'statistics', roles: ['APPROVING_OFFICER', 'OPS_MANAGER'], render: function () {
    var months = S.list('notices', function (n) { return n.status === 'Served'; }).map(function (n) { return n.servedAt.slice(0, 7); })
      .filter(function (v, i, a) { return a.indexOf(v) === i; }).sort().reverse();
    var MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function mLabel(m) { return MN[+m.slice(5) - 1] + ' ' + m.slice(0, 4); }
    document.getElementById('content').innerHTML =
      '<p>Produced automatically from e-filed (served) notices, so there is no manual collation (BR-005). Withdrawn notices and cancelled cases are excluded (BR-027).</p>' +
      '<div class="toolbar">' + A.field('month', 'Period', '<select class="select" id="month"><option value="">All time</option>' + months.map(function (m) { return '<option value="' + m + '">' + mLabel(m) + '</option>'; }).join('') + '</select>') + '</div><div id="stats" aria-live="polite"></div>';
    function draw() {
      var m = document.getElementById('month').value, st = R.BR005_statistics(m);
      var html = '<div class="kpi-grid">' +
        '<div class="kpi"><span class="kpi-label">Notices served and e-filed</span><span class="kpi-value">' + st.notices + '</span></div>' +
        '<div class="kpi is-warning"><span class="kpi-label">Charges</span><span class="kpi-value">' + st.charges + '</span><span class="kpi-sub muted">one per positive habitat (BR-028)</span></div>' +
        '<div class="kpi is-success"><span class="kpi-label">Total composition fines</span><span class="kpi-value">' + A.money(st.totalFine) + '</span><span class="kpi-sub muted">⚙ placeholder amounts</span></div>' +
        '</div>';
      html += '<div class="grid-2"><div class="card"><div class="card-head"><h2>By month served</h2></div>' + A.table([
        { label: 'Month', html: function (r) { return mLabel(r[0]); } },
        { label: 'Notices', num: true, html: function (r) { return r[1].notices; } },
        { label: 'Charges', num: true, html: function (r) { return r[1].charges; } },
        { label: 'Total fines', num: true, html: function (r) { return A.money(r[1].total); } }
      ], Object.keys(st.byMonth).sort().reverse().map(function (k) { return [k, st.byMonth[k]]; }), 'No notices served in this period') + '</div>';
      html += '<div><div class="card"><div class="card-head"><h2>By notice type</h2></div>' + A.table([
        { label: 'Notice type', html: function (r) { return A.esc(r[0]); } }, { label: 'Served', num: true, html: function (r) { return r[1]; } }
      ], Object.keys(st.byType).map(function (k) { return [k, st.byType[k]]; }), 'None') + '</div>';
      html += '<div class="card"><div class="card-head"><h2>By premises type</h2></div>' + A.table([
        { label: 'Premises type', html: function (r) { return A.esc(r[0]); } }, { label: 'Served', num: true, html: function (r) { return r[1]; } }
      ], Object.keys(st.byPremisesType).sort().map(function (k) { return [k, st.byPremisesType[k]]; }), 'None') + '</div></div></div>';
      html += '<div class="card"><div class="card-head"><h2>Enforcement cases by status</h2><span class="muted">' + (m ? 'opened in ' + mLabel(m) : 'all time') + '</span></div>' + A.table([
        { label: 'Status', html: function (r) { return A.badge(r[0]); } }, { label: 'Cases', num: true, html: function (r) { return r[1]; } }
      ], ['Open', 'Awaiting Payment', 'Awaiting Re-inspection', 'Closed', 'Referred for Prosecution'].filter(function (s) { return st.casesByStatus[s]; }).map(function (s) { return [s, st.casesByStatus[s]]; }), 'None') + '</div>';
      document.getElementById('stats').innerHTML = html;
    }
    document.getElementById('month').addEventListener('input', draw);
    draw();
    document.getElementById('csvBtn').addEventListener('click', function () { A.notInScope('CSV export (requirement 27, not selected)'); });
  } });
})();
</script>
</body>
</html>
