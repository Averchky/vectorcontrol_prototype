<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notices · VCS3 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- SCR-09 Notices: approval queue and register (US-011, US-024, US-026) -->
<main id="main" class="app-main" tabindex="-1">
  <div class="page-banner"><div class="breadcrumb">Records</div><h1>Notices</h1></div>
  <div class="page-content" id="content"></div>
</main>
<script src="data/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/rules.js"></script>
<script src="js/workflow.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var S = VCS.store, R = VCS.rules, A = VCS.app;
  A.init({ page: 'notices', render: function () {
    var u = S.currentUser();
    var all = S.list('notices').filter(function (n) {
      if (u.role !== 'FIELD_OFFICER') return true;
      var c = S.get('enforcementCases', n.enforcementCaseId);
      return n.draftedBy === u.id || S.get('inspections', c.inspectionId).assignedTo === u.id; // BR-025
    });
    var statuses = ['Draft', 'Pending Approval', 'Returned', 'Approved', 'Served', 'Withdrawn'];
    var pre = A.qs('status') || '';
    document.getElementById('content').innerHTML =
      (u.role === 'FIELD_OFFICER' ? '<p class="muted">You see notices you drafted or that come from your inspections (BR-025).</p>' : '') +
      '<div class="toolbar" role="search">' +
      A.field('q', 'Search', '<input class="input" id="q" type="search" placeholder="Notice no., address, postal code or owner">') +
      A.field('st', 'Status', '<select class="select" id="st"><option value="">All statuses</option>' + statuses.map(function (s) { return '<option' + (s === pre ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>') +
      A.field('ty', 'Type', '<select class="select" id="ty"><option value="">All types</option><option>Notice of Offence</option><option>Notice to Abate</option></select>') +
      '<div class="field"><label class="choice" style="margin-top:22px"><input type="checkbox" id="od"> Overdue approvals only</label></div>' +
      '</div><div class="result-count" id="count" aria-live="polite"></div><div id="list"></div>';
    function draw() {
      var q = document.getElementById('q').value, st = document.getElementById('st').value, ty = document.getElementById('ty').value, od = document.getElementById('od').checked;
      var rows = all.filter(function (n) {
        var c = S.get('enforcementCases', n.enforcementCaseId), p = S.get('premises', c.premisesId), o = S.get('ownerOccupiers', p.ownerOccupierId);
        return A.matches(n.noticeNo + ' ' + n.id + ' ' + p.address + ' ' + p.postalCode + ' ' + o.name, q) && (!st || n.status === st) && (!ty || n.noticeType === ty) && (!od || R.BR020_isApprovalOverdue(n));
      }).sort(function (a, b) { return a.updatedAt < b.updatedAt ? 1 : -1; });
      document.getElementById('count').textContent = rows.length + ' of ' + all.length + ' notices';
      document.getElementById('list').innerHTML = A.table([
        { label: 'Notice no.', html: function (n) { return A.link('Notice', n.id, n.noticeNo); } },
        { label: 'Premises', html: function (n) { return A.premisesLink(S.get('enforcementCases', n.enforcementCaseId).premisesId); } },
        { label: 'Type', html: function (n) { return A.esc(n.noticeType); } },
        { label: 'Charges', num: true, html: function (n) { return n.charges.length; } },
        { label: 'Total fine', num: true, html: function (n) { return A.money(n.totalFine); } },
        { label: 'Status', html: function (n) { return A.badge(n.status); } },
        { label: 'Approval due', html: function (n) { return n.status === 'Pending Approval' ? A.fmtDate(n.approvalDueAt) + (R.BR020_isApprovalOverdue(n) ? A.overdue() : '') : '—'; } }
      ], rows, 'No notices match these filters');
    }
    ['q', 'st', 'ty', 'od'].forEach(function (id) { document.getElementById(id).addEventListener('input', draw); });
    draw();
  } });
})();
</script>
</body>
</html>
