<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premises detail · VCS3 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- SCR-05 Premises detail (US-019) -->
<main id="main" class="app-main" tabindex="-1">
  <div class="page-banner"><div class="breadcrumb"><a href="premises.html">Premises</a> › <span id="crumb"></span></div><h1 id="pageTitle">Premises</h1>
    <div class="actions" id="bannerActions"></div></div>
  <div class="page-content" id="content"></div>
</main>
<script src="data/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/rules.js"></script>
<script src="js/workflow.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var S = VCS.store, R = VCS.rules, A = VCS.app;
  A.init({ page: 'premises-detail', render: function () {
    var p = S.get('premises', A.qs('id'));
    var content = document.getElementById('content');
    if (!p) { content.innerHTML = '<div class="empty-state"><h2>Premises not found</h2><p><a href="premises.html">Back to premises</a></p></div>'; return; }
    var u = S.currentUser(), o = S.get('ownerOccupiers', p.ownerOccupierId), risk = R.BR016_riskReasons(p);
    document.title = p.address + ' · VCS3 prototype';
    document.getElementById('pageTitle').textContent = p.address;
    document.getElementById('crumb').textContent = p.id;
    var next = R.BR015_offenceCount(p.id, R.addDays(R.today(), 1));
    var nextType = R.BR014_noticeType(next), nextFine = R.BR013_finePerCharge(p.premisesType, next);
    var ins = R.BR025_visibleInspections(u).filter(function (i) { return i.premisesId === p.id; }).sort(function (a, b) { return (a.visitedAt || a.dueDate) < (b.visitedAt || b.dueDate) ? 1 : -1; });
    var cases = S.list('enforcementCases', function (c) { return c.premisesId === p.id; }).sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; });
    content.innerHTML =
      (risk.length ? '<div class="banner banner-danger"><div><strong>▲ High-risk premises (BR-016)</strong>' + risk.map(function (r) { return '<span class="chip">' + A.esc(r.text) + '</span>'; }).join('') + '</div></div>' : '') +
      '<div class="grid-2"><div class="card"><div class="card-head"><h2>Premises</h2></div><dl class="dl-grid">' +
      '<div><dt>Premises ID</dt><dd>' + p.id + '</dd></div><div><dt>Type</dt><dd>' + A.esc(p.premisesType) + '</dd></div>' +
      '<div><dt>Postal code</dt><dd>' + A.esc(p.postalCode) + '</dd></div><div><dt>Location</dt><dd>' + p.latitude.toFixed(5) + ', ' + p.longitude.toFixed(5) + '</dd></div>' +
      '</dl></div><div class="card"><div class="card-head"><h2>Owner / Occupier</h2></div><dl class="dl-grid">' +
      '<div><dt>Name</dt><dd>' + A.esc(o.name) + '</dd></div><div><dt>Type</dt><dd>' + A.esc(o.ownerType) + '</dd></div>' +
      (o.uen ? '<div><dt>UEN</dt><dd>' + A.esc(o.uen) + '</dd></div>' : '') + '<div><dt>Contact</dt><dd>' + A.esc(o.contactNumber) + '</dd></div></dl></div></div>' +
      '<div class="card"><div class="card-head"><h2>Offence history</h2></div><p>Offences in the last ' + S.config().offenceLookbackMonths + ' months: <strong>' + (next - 1) + '</strong> (BR-015). ' +
      'If breeding is confirmed today, this would be offence no. <strong>' + next + '</strong>: a ' + A.esc(nextType) + (nextType === 'Notice of Offence' ? ' with <strong>' + A.money(nextFine) + '</strong> per charge (BR-013).' : ' with no composition fine; the case is referred for prosecution (BR-014).') + '</p>' +
      A.table([
        { label: 'Case', html: function (c) { return A.link('EnforcementCase', c.id); } },
        { label: 'Opened', html: function (c) { return A.fmtDate(c.createdAt); } },
        { label: 'Offence no.', num: true, html: function (c) { return c.offenceCount; } },
        { label: 'Status', html: function (c) { return A.badge(c.status); } }
      ], cases, 'No enforcement cases') + '</div>' +
      '<div class="card"><div class="card-head"><h2>Inspections</h2></div>' + (u.role === 'FIELD_OFFICER' ? '<p class="muted">Showing inspections assigned to you (BR-025).</p>' : '') +
      A.table([
        { label: 'Inspection', html: function (i) { return A.link('Inspection', i.id); } },
        { label: 'Kind', html: function (i) { return i.isReinspection ? 'Re-inspection' : i.isRevisit ? 'Re-visit' : 'Inspection'; } },
        { label: 'Officer', html: function (i) { return A.esc(A.userName(i.assignedTo)); } },
        { label: 'Visited / due', html: function (i) { return i.visitedAt ? A.fmtDate(i.visitedAt) : 'Due ' + A.fmtDate(i.dueDate) + (R.isInspectionOverdue(i) ? A.overdue() : ''); } },
        { label: 'Status', html: function (i) { return A.badge(i.status); } }
      ], ins, 'No inspections') + '</div>';
    var ba = document.getElementById('bannerActions');
    if (u.role === 'OPS_MANAGER') {
      ba.innerHTML = '<button type="button" class="btn btn-secondary" id="assignBtn">Assign inspection</button>';
      document.getElementById('assignBtn').addEventListener('click', function () { A.assignModal(p.id); });
    }
  } });
})();
</script>
</body>
</html>
